<div id="contenedorListaCompetidores" class="container mt-5">
    <h1 class="text-center mb-4">Lista de Expertos</h1>

    <!-- Barra de búsqueda -->
    <div class="mb-3">
        <label for="search" class="form-label">Buscar por Nombre</label>
        <input 
            type="text" 
            id="search" 
            class="form-control" 
            [(ngModel)]="searchText" 
            placeholder="Escribe el nombre para filtrar"
        />
    </div>

    <!-- Botón para abrir el formulario para agregar una nueva especialidad -->
    <div class="mb-3 text-right">
        <button class="btn btn-primary" (click)="abrirFormulario(modalContent)">Nuevo</button>
    </div>

    <!-- Mostrar mensaje de error si existe -->
    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <!-- Tabla de Expertos -->
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col" (click)="ordenarPor('id')">ID</th>
                <th scope="col" (click)="ordenarPor('cod')">Código</th>
                <th scope="col" (click)="ordenarPor('name')">Especialidad</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let es of listSpecialty | filter:searchText">
                <td>{{ es.id }}</td>
                <td>{{ es.cod }}</td>
                <td>{{ es.name }}</td>
                <td>
                    <button class="btn btn-warning btn-sm" (click)="editarEspecialidad(es, modalContent)">Editar</button>
                    <button class="btn btn-danger btn-sm" (click)="delete(es.id)">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Modal Template -->
    <ng-template #modalContent let-modal>
        <div class="modal-header bg-dark"></div>
        <div class="modal-header">
            <h5 class="modal-title" id="modalFormularioLabel">{{ isEdit ? 'Editar Especialidad' : 'Agregar Especialidad' }}</h5>
            <button type="button" class="btn-close" (click)="modal.close()"></button>
        </div>
        <div class="modal-body">
            <form (ngSubmit)="guardarEspecialidad()">
                <div class="mb-3">
                    <label for="cod" class="form-label">Código</label>
                    <input type="text" id="cod" class="form-control" [(ngModel)]="specialty.cod" name="cod" required>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" class="form-control" [(ngModel)]="specialty.name" name="name" required>
                </div>
                <!-- Mostrar mensaje de error dentro del modal -->
                <div *ngIf="errorMessage" class="alert alert-danger">
                    {{ errorMessage }}
                </div>
                <button type="submit" class="btn btn-success">{{ isEdit ? 'Guardar Cambios' : 'Agregar Especialidad' }}</button>
            </form>
        </div>
    </ng-template>
</div>
