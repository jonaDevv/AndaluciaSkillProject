<div id="contenedorListaCompetidores" class="container mt-5">
    <h1 class="text-center mb-4">Lista de Ganadores</h1>
    <div class="mb-3">
        <label for="search" class="form-label">Buscar por Nombre</label>
        <input 
            type="text" 
            id="search" 
            class="form-control" 
            [(ngModel)]="searchText" 
            placeholder="Escribe el nombre para filtrar"
        />
    </div>

   

    <!-- Mostrar mensaje de error si existe -->
    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <!-- Tabla de Expertos -->
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col" (click)="ordenarPor('id')">ID</th>
                <th scope="col" (click)="ordenarPor('name')">Nombre</th>
                <th scope="col" (click)="ordenarPor('center')">Centro</th>
                <th scope="col" (click)="ordenarPor('specialtyName')">Especialidad</th>
                <th scope="col" (click)="ordenarPor('totalScore')">Puntuación Total</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let p of ListaGanadores | filter:searchText">
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.center }}</td>
                <td>{{ p.specialtyName}}</td>
                <td>{{ p.totalScore }}</td>
                
            </tr>
        </tbody>
    </table>

   

</div>
