<div id="contenedorListaCompetidores" class="container mt-5">
    <h1 class="text-center mb-4">Lista de Competidores</h1>
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Especialidad</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let competidor of listacompetidores">
                <td>{{competidor.id}}</td>
                <td>{{competidor.nombre}}</td>
                <td>{{competidor.especialidad}}</td>
            </tr>
        </tbody>
    </table>
</div>
