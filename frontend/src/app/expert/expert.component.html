<div id="contenedorListaCompetidores" class="container mt-5">
    <h1 class="text-center mb-4">Lista de Expertos</h1>
    <div class="mb-3">
        <label for="search" class="form-label">Buscar por Nombre</label>
        <input 
            type="text" 
            id="search" 
            class="form-control" 
            [(ngModel)]="searchText" 
            placeholder="Escribe el nombre para filtrar"
        />
    </div>

    <!-- Botón para abrir el formulario para agregar un nuevo experto -->
    <div class="mb-3 text-right">
        <button class="btn btn-primary" (click)="abrirFormulario(modalContent)">Nuevo</button>
    </div>

    <!-- Mostrar mensaje de error si existe -->
    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <!-- Tabla de Expertos -->
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col" (click)="ordenarPor('id')">ID</th>
                <th scope="col" (click)="ordenarPor('dni')">DNI</th>
                <th scope="col" (click)="ordenarPor('nombre')">Nombre</th>
                <th scope="col" (click)="ordenarPor('username')">Username</th>
                <th scope="col" (click)="ordenarPor('specialtyName')">Especialidad</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let ex of listExpert | filter:searchText">
                <td>{{ ex.id }}</td>
                <td>{{ ex.dni }}</td>
                <td>{{ ex.nombre }}</td>
                <td>{{ ex.username }}</td>
                <td>{{ ex.specialtyName }}</td>
                <td>
                    <button class="btn btn-warning btn-sm" (click)="editarExperto(ex, modalContent)">Editar</button>
                    <button class="btn btn-danger btn-sm" (click)="delete(ex.id)">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Modal Template -->
    <ng-template #modalContent let-modal>
        <div class="modal-header bg-dark"></div>
        <div class="modal-header">
            <h5 class="modal-title" id="modalFormularioLabel">{{ isEditing ? 'Editar Experto' : 'Agregar Experto' }}</h5>
            <button type="button" class="btn-close" (click)="modal.close()"></button>
        </div>
        <div class="modal-body">
            <form (ngSubmit)="guardarExperto()">
                <div class="mb-3">
                    <label for="dni" class="form-label">DNI</label>
                    <input type="text" id="dni" class="form-control" [(ngModel)]="experto.dni" name="dni" required>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" [(ngModel)]="experto.nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" [(ngModel)]="experto.username" name="username" required>
                </div>
                <div class="mb-3" *ngIf="!isEditing">
                    <label for="password" class="form-label">Pasword</label>
                    <input type="text" id="password" class="form-control" [(ngModel)]="experto.password" name="password" required>
                </div>
                <!-- <div class="mb-3">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <select
                        id="especialidad"
                        class="form-control"
                        name="especialidad"
                        required
                        [ngStyle]="{ 'max-height': '200px', 'overflow-y': 'auto' }">
                        <option ngValue="">{{ isEditing ? experto.specialtyName : 'Seleccione una especialidad' }}</option>
                        <option *ngFor="let specialty of listSpecialty" [ngValue]="specialty.id">
                            
                            {{ specialty.name }}
                        </option>
                    </select>
                </div> -->
                <div class="mb-3">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <select
                        id="especialidad"
                        class="form-control"
                        name="especialidad"
                        required
                        [(ngModel)]="experto.specialtyId" 
                        [ngStyle]="{ 'max-height': '200px', 'overflow-y': 'auto' }">
                        <!-- Opción predeterminada -->
                        <option *ngIf="isEditing" [ngValue]="null"> {{ experto.specialtyName }} </option>
                        <option *ngIf="!isEditing" [ngValue]="null">Seleccione una especialidad</option>
                        <!-- Opciones dinámicas -->
                        <option *ngFor="let specialty of listSpecialty" [ngValue]="specialty.id">
                            {{ specialty.name }}
                        </option>
                    </select>
                </div>
                <!-- Mostrar mensaje de error dentro del modal -->
                <div *ngIf="errorMessage" class="alert alert-danger">
                    {{ errorMessage }}
                </div>
                <button type="submit" class="btn btn-success">{{ isEditing ? 'Guardar Cambios' : 'Agregar Experto' }}</button>
            </form>
        </div>
    </ng-template>
</div>
